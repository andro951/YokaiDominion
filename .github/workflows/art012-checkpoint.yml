name: Art012 fixed-view sculpt checkpoints
on:
  push:
    paths: ['tools/art/sculpt012.py', '.github/workflows/art012-checkpoint.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: art012-sculpt
  cancel-in-progress: false
jobs:
  sculpt-save-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact Art011 master
        run: |
          set -euo pipefail
          mkdir -p output
          curl -fL --retry 3 https://raw.githubusercontent.com/andro951/YokaiDominion/f1c9cc7a621ea1d70f0725f7a1ab1fc2ed599de0/art/checkpoints/art011/4cb4818d7029/Character01_Art011.blend -o "$RUNNER_TEMP/base.blend"
          echo "54ab5f8d2cc71160c12522d046c396db19604b6ef7c2c1bc130ebba18032b948  $RUNNER_TEMP/base.blend" | sha256sum -c -
          echo "ASSET_PATH=art/checkpoints/art012/${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > output/source.ref
          cp tools/art/sculpt012.py tools/art/review012.py output/
      - name: Install checksum-verified Blender
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o blender.tar.xz
          echo '975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  blender.tar.xz' | sha256sum -c -
          tar -xf blender.tar.xz
          echo "BLENDER=$RUNNER_TEMP/blender-4.5.3-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Sculpt and save before rendering
        env:
          OPENBLAS_NUM_THREADS: 2
        run: |
          set -euo pipefail
          "$BLENDER" -b -t 4 --python-exit-code 1 --python tools/art/sculpt012.py -- --source "$RUNNER_TEMP/base.blend" --out output > output/sculpt.log 2>&1
          grep -q ART012_SAVED_REOPENED output/sculpt.log
      - name: Commit actual editable candidate immediately
        id: save
        run: |
          set -euo pipefail
          test -s output/Character01_Art012.blend
          git config user.name 'Yokai checkpoint bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 origin art-checkpoints
          git worktree add --detach "$RUNNER_TEMP/assets" FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/assets/$ASSET_PATH"
          cp output/* "$RUNNER_TEMP/assets/$ASSET_PATH/"
          cd "$RUNNER_TEMP/assets"
          git add "$ASSET_PATH"
          git commit -m "Save actual Art012 candidate ${GITHUB_SHA:0:12} before review [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/art-checkpoints; then break; fi
            git fetch origin art-checkpoints
            git rebase FETCH_HEAD
          done
          commit=$(git rev-parse HEAD)
          git fetch origin art-checkpoints
          git merge-base --is-ancestor "$commit" FETCH_HEAD
          echo "ASSET_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Download committed model, compare checksum, reopen
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,hashlib,pathlib,urllib.request
          out=pathlib.Path('output');m=json.loads((out/'manifest.json').read_text());checks={}
          for name,expected in m['files'].items():
              url=f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/{os.environ['ASSET_COMMIT']}/{os.environ['ASSET_PATH']}/{name}"
              with urllib.request.urlopen(url,timeout=180) as r:data=r.read()
              assert len(data)==expected['bytes'] and hashlib.sha256(data).hexdigest()==expected['sha256']
              pathlib.Path(os.environ['RUNNER_TEMP'],'remote.blend').write_bytes(data)
              checks[name]=dict(expected,matched=True)
          (out/'remote-readback.json').write_text(json.dumps({'assetCommit':os.environ['ASSET_COMMIT'],'assetPath':os.environ['ASSET_PATH'],'files':checks},indent=2))
          PY
          "$BLENDER" -b "$RUNNER_TEMP/remote.blend" --python-exit-code 1 --python-expr "import bpy; assert bpy.data.objects['Body'].get('art012'); print('ART012_REMOTE_REOPEN_PASS')" > output/reopen.log 2>&1
          grep -q ART012_REMOTE_REOPEN_PASS output/reopen.log
      - name: Fixed front, side and three-quarter review
        run: |
          "$BLENDER" -b -t 4 --python-exit-code 1 --python tools/art/review012.py -- --source "$RUNNER_TEMP/remote.blend" --out output/review --shots front,quarter,side --width 720 --samples 24 > output/render.log 2>&1
      - name: Preserve actual renders and verification
        if: always() && steps.save.outcome == 'success'
        run: |
          set -euo pipefail
          cp output/*.json output/*.log "$RUNNER_TEMP/assets/$ASSET_PATH/"
          if test -d output/review; then cp -r output/review "$RUNNER_TEMP/assets/$ASSET_PATH/"; fi
          cd "$RUNNER_TEMP/assets"
          git add "$ASSET_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Save fixed Art012 review and readback ${GITHUB_SHA:0:12} [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/art-checkpoints; then break; fi
              git fetch origin art-checkpoints
              git rebase FETCH_HEAD
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art012-candidate-and-fixed-review
          path: output/
          retention-days: 30
          if-no-files-found: error
