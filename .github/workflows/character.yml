name: Character blockout and deformation
on:
  push:
    paths: ['tools/blender/build_character.py', 'tools/validate_character.py', 'game/Scripts/Character*.cs', 'game/Scenes/Character*.tscn', 'src/Yokai.Tissue/**', '.github/workflows/character.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: character-${{ github.ref }}
  cancel-in-progress: true
jobs:
  character:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BLENDER_VERSION: '4.5.3'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          cd "$RUNNER_TEMP/blender"
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.5"
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/blender-${BLENDER_VERSION}.sha256" -o checksums.txt
          grep -F "$archive" checksums.txt | sha256sum --check -
          tar -xf "$archive"
          echo "BLENDER_BIN=$RUNNER_TEMP/blender/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Build character, rig, poses and tissue cages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          timeout 1100s "$BLENDER_BIN" --background --python-exit-code 1 --python tools/blender/build_character.py -- --out artifacts/character 2>&1 | tee artifacts/character-build.log
          grep -q YOKAI_CHARACTER_BUILD_PASS artifacts/character-build.log
      - name: Preserve exact source checkpoint
        if: always()
        run: git archive --format=zip --output=artifacts/production-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-blockout
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
