name: Art011 verified textured files
on:
  push:
    paths: ['tools/art/export011.py', '.github/workflows/portable011.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: art011-portable
  cancel-in-progress: false
jobs:
  export-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact saved Art011 and PBR010 models
        run: |
          set -euo pipefail
          mkdir -p output
          curl -fL --retry 3 https://raw.githubusercontent.com/andro951/YokaiDominion/f1c9cc7a621ea1d70f0725f7a1ab1fc2ed599de0/art/checkpoints/art011/4cb4818d7029/Character01_Art011.blend -o "$RUNNER_TEMP/master.blend"
          echo "54ab5f8d2cc71160c12522d046c396db19604b6ef7c2c1bc130ebba18032b948  $RUNNER_TEMP/master.blend" | sha256sum -c -
          curl -fL --retry 3 https://raw.githubusercontent.com/andro951/YokaiDominion/fbf573aa787642f20de8f04ffd0b5ba8b21804aa/art/checkpoints/portable010/0c398c1c4611/Character01_PBR010.blend -o "$RUNNER_TEMP/portable.blend"
          echo "63bdf2a9d015d2f1182dab573973cc1dd2f5daaca6ffd913600a94727c5d1b15  $RUNNER_TEMP/portable.blend" | sha256sum -c -
          echo "ASSET_PATH=art/checkpoints/portable011/${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > output/source.ref
          cp tools/art/export011.py tools/art/refine011.py output/
      - name: Install verified Blender
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o blender.tar.xz
          echo '975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  blender.tar.xz' | sha256sum -c -
          tar -xf blender.tar.xz
          echo "BLENDER=$RUNNER_TEMP/blender-4.5.3-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Transfer edits and save real textured models
        env:
          OPENBLAS_NUM_THREADS: 2
        run: |
          set -euo pipefail
          "$BLENDER" -b -t 4 --python-exit-code 1 --python tools/art/export011.py -- --master "$RUNNER_TEMP/master.blend" --portable "$RUNNER_TEMP/portable.blend" --out output > output/export.log 2>&1
          grep -q ART011_PORTABLE_PASS output/export.log
      - name: Push actual Blender and GLB before rendering
        id: save
        run: |
          set -euo pipefail
          test -s output/Character01_Visual011.glb
          git config user.name 'Yokai checkpoint bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 origin art-checkpoints
          git worktree add --detach "$RUNNER_TEMP/assets" FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/assets/$ASSET_PATH"
          cp output/* "$RUNNER_TEMP/assets/$ASSET_PATH/"
          cd "$RUNNER_TEMP/assets"
          git add "$ASSET_PATH"
          git commit -m "Save actual Art011 textured model ${GITHUB_SHA:0:12} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/art-checkpoints; then break; fi
            git fetch origin art-checkpoints
            git rebase FETCH_HEAD
          done
          remote=$(git ls-remote origin refs/heads/art-checkpoints | cut -f1)
          test "$remote" = "$(git rev-parse HEAD)"
          echo "ASSET_COMMIT=$remote" >> "$GITHUB_ENV"
      - name: Verify downloaded binary files and reopen Blender file
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path('output');m=json.loads((out/'portable-manifest.json').read_text());checks={}
          for name,expected in m['files'].items():
              url=f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/{os.environ['ASSET_COMMIT']}/{os.environ['ASSET_PATH']}/{name}"
              with urllib.request.urlopen(url,timeout=180) as r:data=r.read()
              assert len(data)==expected['bytes'] and hashlib.sha256(data).hexdigest()==expected['sha256']
              (out/name).write_bytes(data);checks[name]=dict(expected,matched=True)
          (out/'remote-readback.json').write_text(json.dumps({'assetCommit':os.environ['ASSET_COMMIT'],'assetPath':os.environ['ASSET_PATH'],'allMatched':True,'files':checks},indent=2))
          PY
          "$BLENDER" -b output/Character01_PBR011.blend --python-exit-code 1 --python-expr "import bpy; assert bpy.data.objects['Body'].get('art011'); assert bpy.data.objects['Loose over-trapezius panel L'].get('art011'); print('ART011_REMOTE_PBR_REOPEN_PASS')" > output/reopen.log 2>&1
          grep -q ART011_REMOTE_PBR_REOPEN_PASS output/reopen.log
      - name: Reimport and render the actual exported GLB
        run: |
          "$BLENDER" -b -t 4 --python-exit-code 1 --python tools/art/export011.py -- --out output --review > output/reimport.log 2>&1
      - name: Save verification and export renders
        if: always() && steps.save.outcome == 'success'
        run: |
          set -euo pipefail
          cp output/*.json output/*.log "$RUNNER_TEMP/assets/$ASSET_PATH/"
          if test -d output/reimport; then cp -r output/reimport "$RUNNER_TEMP/assets/$ASSET_PATH/"; fi
          cd "$RUNNER_TEMP/assets"
          git add "$ASSET_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Verify Art011 textured binaries and reimport ${GITHUB_SHA:0:12} [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/art-checkpoints; then break; fi
              git fetch origin art-checkpoints
              git rebase FETCH_HEAD
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art011-portable-verified
          path: output/
          retention-days: 30
          if-no-files-found: error
