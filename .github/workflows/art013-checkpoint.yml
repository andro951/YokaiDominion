name: Art013 saved-model visual review
on:
  push:
    paths: ['tools/art/finish013.py', '.github/workflows/art013-checkpoint.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  save-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact Art012 anatomical and draped master
        run: |
          set -euo pipefail
          mkdir -p output
          curl -fL --retry 3 https://raw.githubusercontent.com/andro951/YokaiDominion/ff9c69ec8273009e3009b92dde02e0a7f72262bd/art/checkpoints/drape012/0510ec795b96/Character01_Art012.blend -o "$RUNNER_TEMP/base.blend"
          echo "deec460a59fd2b6149ed4ffb5498a285fe9b0eb5da9bd0003cd848e06239238b  $RUNNER_TEMP/base.blend" | sha256sum -c -
          echo "ASSET_PATH=art/checkpoints/art013/${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > output/source.ref
          cp tools/art/finish013.py tools/art/review013.py output/
      - name: Install checksum-verified Blender
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o blender.tar.xz
          echo '975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  blender.tar.xz' | sha256sum -c -
          tar -xf blender.tar.xz
          echo "BLENDER=$RUNNER_TEMP/blender-4.5.3-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Edit and reopen full saved mesh before rendering
        env:
          OPENBLAS_NUM_THREADS: 2
        run: |
          set -euo pipefail
          "$BLENDER" -b -t 4 --python-exit-code 1 --python tools/art/finish013.py -- --source "$RUNNER_TEMP/base.blend" --out output > output/edit.log 2>&1
          grep -q ART013_SAVED_REOPENED output/edit.log
      - name: Commit actual editable Blender bytes immediately
        id: save
        run: |
          set -euo pipefail
          test -s output/Character01_Art013.blend
          git config user.name 'Yokai checkpoint bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 origin art-checkpoints
          git worktree add --detach "$RUNNER_TEMP/assets" FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/assets/$ASSET_PATH"
          cp output/* "$RUNNER_TEMP/assets/$ASSET_PATH/"
          cd "$RUNNER_TEMP/assets"
          git add "$ASSET_PATH"
          git commit -m "Save actual Art013 mesh ${GITHUB_SHA:0:12} before rendering [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/art-checkpoints; then break; fi
            git fetch origin art-checkpoints;git rebase FETCH_HEAD
          done
          commit=$(git rev-parse HEAD)
          git fetch origin art-checkpoints;git merge-base --is-ancestor "$commit" FETCH_HEAD
          echo "ASSET_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Download the immutable committed mesh and verify it
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,hashlib,pathlib,urllib.request
          out=pathlib.Path('output');m=json.loads((out/'manifest.json').read_text());checks={}
          for name,expected in m['files'].items():
              url=f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/{os.environ['ASSET_COMMIT']}/{os.environ['ASSET_PATH']}/{name}"
              with urllib.request.urlopen(url,timeout=180) as r:data=r.read()
              assert len(data)==expected['bytes'] and hashlib.sha256(data).hexdigest()==expected['sha256']
              (out/name).write_bytes(data);checks[name]=dict(expected,matched=True)
          (out/'remote-readback.json').write_text(json.dumps({'assetCommit':os.environ['ASSET_COMMIT'],'assetPath':os.environ['ASSET_PATH'],'allMatched':True,'files':checks},indent=2))
          PY
          "$BLENDER" -b output/Character01_Art013.blend --python-exit-code 1 --python-expr "import bpy; assert bpy.data.objects['Body'].get('art013'); assert bpy.data.objects['Loose over-trapezius panel L'].get('art013'); print('ART013_REMOTE_REOPEN_PASS')" > output/reopen.log 2>&1
          grep -q ART013_REMOTE_REOPEN_PASS output/reopen.log
      - name: Fixed views of the already backed-up mesh
        run: |
          "$BLENDER" -b -t 4 --python-exit-code 1 --python tools/art/review013.py -- --source output/Character01_Art013.blend --out output/review --shots front,quarter,side,shoulder,full --width 800 --samples 32 > output/render.log 2>&1
      - name: Persist actual renders and readback evidence
        if: always() && steps.save.outcome == 'success'
        run: |
          set -euo pipefail
          cp output/*.json output/*.log "$RUNNER_TEMP/assets/$ASSET_PATH/"
          if test -d output/review; then cp -r output/review "$RUNNER_TEMP/assets/$ASSET_PATH/"; fi
          cd "$RUNNER_TEMP/assets"
          git add "$ASSET_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Save fixed-view Art013 renders ${GITHUB_SHA:0:12} [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/art-checkpoints; then break; fi
              git fetch origin art-checkpoints;git rebase FETCH_HEAD
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art013-master-and-review
          path: output/
          retention-days: 30
          if-no-files-found: error
