name: Godot integration and rendered smoke
on:
  push:
    paths: ['game/**', 'src/**', 'global.json', 'Directory.Build.props', '.github/workflows/godot.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: '4.7.2'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download and verify pinned Godot .NET
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          archive="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          grep -F "$archive" SHA512-SUMS.txt | sha512sum --check -
          unzip -q "$archive"
          exe="$(find "$RUNNER_TEMP/godot" -type f -name 'Godot_v*_mono_linux.x86_64' | head -n 1)"
          test -n "$exe"
          chmod +x "$exe"
          echo "GODOT_BIN=$exe" >> "$GITHUB_ENV"
      - name: Compile CSharp engine integration
        run: dotnet build game/YokaiDominion.csproj -c Debug
      - name: Import and run headless scene
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          "$GODOT_BIN" --version | tee artifacts/godot-version.txt
          timeout 90s "$GODOT_BIN" --headless --editor --path game --import 2>&1 | tee artifacts/godot-import.log
          timeout 90s "$GODOT_BIN" --headless --path game -- --smoke 2>&1 | tee artifacts/godot-headless.log
          grep -q YOKAI_GODOT_SMOKE_PASS artifacts/godot-headless.log
      - name: Install software display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Render actual engine screenshot
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s xvfb-run -a "$GODOT_BIN" --path game --rendering-method gl_compatibility -- --smoke --capture="$GITHUB_WORKSPACE/artifacts/godot-lab.png" 2>&1 | tee artifacts/godot-rendered.log
          grep -q YOKAI_GODOT_SMOKE_PASS artifacts/godot-rendered.log
          test -s artifacts/godot-lab.png
      - name: Archive source checkpoint
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=zip --output=artifacts/source-checkpoint.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-laboratory
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
