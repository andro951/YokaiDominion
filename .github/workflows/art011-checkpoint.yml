name: Art011 chest and cloth checkpoint
on:
  push:
    paths: ['tools/art/refine011.py', '.github/workflows/art011-checkpoint.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: art011-checkpoint
  cancel-in-progress: false
jobs:
  save-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned actual Art010 master
        run: |
          set -euo pipefail
          mkdir -p output
          curl -fL --retry 3 https://raw.githubusercontent.com/andro951/YokaiDominion/9d2ebe2f3532d5fd84762caa601cc412f424f250/art/checkpoints/art010/121d100576f5/Character01_Art010.blend -o "$RUNNER_TEMP/base.blend"
          echo "ffb67040af36dbd7063892fed8a25b76dfe7710ea52a6c1d2ccc1ed8632e5b66  $RUNNER_TEMP/base.blend" | sha256sum -c -
          echo "ASSET_PATH=art/checkpoints/art011/${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > output/source.ref
          cp tools/art/refine011.py output/
      - name: Install checksum verified Blender
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o blender.tar.xz
          echo '975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  blender.tar.xz' | sha256sum -c -
          tar -xf blender.tar.xz
          echo "BLENDER=$RUNNER_TEMP/blender-4.5.3-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Edit and save before rendering
        env:
          OPENBLAS_NUM_THREADS: 2
        run: |
          set -euo pipefail
          "$BLENDER" -b -t 4 --python-exit-code 1 --python tools/art/refine011.py -- --source "$RUNNER_TEMP/base.blend" --out output > output/edit.log 2>&1
          grep -q ART011_SAVED_REOPENED output/edit.log
      - name: Commit and push actual editable bytes immediately
        id: save
        run: |
          set -euo pipefail
          test -s output/Character01_Art011.blend
          git config user.name 'Yokai checkpoint bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 origin art-checkpoints
          git worktree add --detach "$RUNNER_TEMP/assets" FETCH_HEAD
          dst="$RUNNER_TEMP/assets/$ASSET_PATH"
          mkdir -p "$dst"
          cp output/* "$dst/"
          cd "$RUNNER_TEMP/assets"
          git add "$ASSET_PATH"
          git commit -m "Save actual Art011 model ${GITHUB_SHA:0:12} before render [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/art-checkpoints; then break; fi
            git fetch origin art-checkpoints
            git rebase FETCH_HEAD
          done
          remote=$(git ls-remote origin refs/heads/art-checkpoints | cut -f1)
          test "$remote" = "$(git rev-parse HEAD)"
          echo "ASSET_COMMIT=$remote" >> "$GITHUB_ENV"
      - name: Download immutable remote bytes and reopen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path('output');m=json.loads((out/'manifest.json').read_text());checks={}
          for name,expected in m['files'].items():
              url=f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/{os.environ['ASSET_COMMIT']}/{os.environ['ASSET_PATH']}/{name}"
              with urllib.request.urlopen(url,timeout=180) as r:data=r.read()
              assert len(data)==expected['bytes'] and hashlib.sha256(data).hexdigest()==expected['sha256']
              checks[name]=dict(expected,matched=True)
              pathlib.Path(os.environ['RUNNER_TEMP'],'remote.blend').write_bytes(data)
          (out/'remote-readback.json').write_text(json.dumps({'assetCommit':os.environ['ASSET_COMMIT'],'assetPath':os.environ['ASSET_PATH'],'files':checks},indent=2))
          PY
          "$BLENDER" -b "$RUNNER_TEMP/remote.blend" --python-exit-code 1 --python-expr "import bpy; assert bpy.data.objects['Body'].get('art011'); assert bpy.data.objects['Loose over-trapezius panel L'].get('art011'); print('ART011_REMOTE_REOPEN_PASS')" > output/reopen.log 2>&1
          grep -q ART011_REMOTE_REOPEN_PASS output/reopen.log
      - name: Render already-backed-up model
        run: |
          "$BLENDER" -b -t 4 --python-exit-code 1 --python tools/art/refine011.py -- --source "$RUNNER_TEMP/remote.blend" --out output --render-only --views torso,three-quarter,side,shoulder --width 850 --samples 24 > output/render.log 2>&1
      - name: Preserve previews and verification
        if: always() && steps.save.outcome == 'success'
        run: |
          set -euo pipefail
          cp output/*.png output/*.json output/*.log "$RUNNER_TEMP/assets/$ASSET_PATH/" 2>/dev/null || true
          cd "$RUNNER_TEMP/assets"
          git add "$ASSET_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Save Art011 actual renders and readback ${GITHUB_SHA:0:12} [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/art-checkpoints; then break; fi
              git fetch origin art-checkpoints
              git rebase FETCH_HEAD
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art011-editable-verified
          path: output/
          retention-days: 30
          if-no-files-found: error
