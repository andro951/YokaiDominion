name: Art010 verified textured model
on:
  push:
    paths: ['.github/workflows/portable010.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: art010-portable
  cancel-in-progress: false
jobs:
  export-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact edited master and original textured model
        run: |
          set -euo pipefail
          mkdir -p output
          curl -fL --retry 3 https://raw.githubusercontent.com/andro951/YokaiDominion/9d2ebe2f3532d5fd84762caa601cc412f424f250/art/checkpoints/art010/121d100576f5/Character01_Art010.blend -o "$RUNNER_TEMP/master.blend"
          echo "ffb67040af36dbd7063892fed8a25b76dfe7710ea52a6c1d2ccc1ed8632e5b66  $RUNNER_TEMP/master.blend" | sha256sum -c -
          curl -fL --retry 3 https://raw.githubusercontent.com/andro951/YokaiDominion/98ada9f495fc754a2b8f20823dc38cce85ca9d17/art/checkpoints/portable008/e8a6f76486e9/Character01_PBR008.blend -o "$RUNNER_TEMP/portable.blend"
          echo "08239fda16dcc8ae3b82523ba28e806b3b3bd3535140e96dc0e3047cab8a1fd5  $RUNNER_TEMP/portable.blend" | sha256sum -c -
          echo "ASSET_PATH=art/checkpoints/portable010/${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > output/source.ref
          printf '%s\n' 9d2ebe2f3532d5fd84762caa601cc412f424f250 > output/master-asset.ref
          cp tools/art/export010.py tools/art/bust_drape010.py tools/art/bust_shape010.py output/
      - name: Install verified Blender
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o blender.tar.xz
          echo '975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  blender.tar.xz' | sha256sum -c -
          tar -xf blender.tar.xz
          echo "BLENDER=$RUNNER_TEMP/blender-4.5.3-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Transfer actual mesh changes and export textured model
        env:
          OPENBLAS_NUM_THREADS: 4
        run: |
          set -euo pipefail
          "$BLENDER" -b -t 4 --python-exit-code 1 --python tools/art/export010.py -- --master "$RUNNER_TEMP/master.blend" --portable "$RUNNER_TEMP/portable.blend" --out output > output/export.log 2>&1
          grep -q ART010_PORTABLE_EXPORT_PASS output/export.log
      - name: Commit the actual PBR blend and GLB before rendering
        id: save
        run: |
          set -euo pipefail
          test -s output/Character01_PBR010.blend
          test -s output/Character01_Visual010.glb
          git config user.name 'Yokai checkpoint bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 origin art-checkpoints
          git worktree add --detach "$RUNNER_TEMP/persistent-art" FETCH_HEAD
          dst="$RUNNER_TEMP/persistent-art/$ASSET_PATH"
          mkdir -p "$dst"
          cp output/* "$dst/"
          cd "$RUNNER_TEMP/persistent-art"
          git add "$ASSET_PATH"
          git commit -m "Save actual Art010 textured asset ${GITHUB_SHA:0:12} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/art-checkpoints; then break; fi
            git fetch origin art-checkpoints
            git rebase FETCH_HEAD
          done
          remote=$(git ls-remote origin refs/heads/art-checkpoints | cut -f1)
          test "$remote" = "$(git rev-parse HEAD)"
          echo "ASSET_COMMIT=$remote" >> "$GITHUB_ENV"
      - name: Download committed files and verify byte identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path('output');manifest=json.loads((out/'portable-manifest.json').read_text());files={}
          for name,expected in manifest['files'].items():
              url=f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/{os.environ['ASSET_COMMIT']}/{os.environ['ASSET_PATH']}/{name}"
              with urllib.request.urlopen(url,timeout=180) as r:data=r.read()
              assert len(data)==expected['bytes'] and hashlib.sha256(data).hexdigest()==expected['sha256']
              (out/name).write_bytes(data)
              files[name]=dict(expected,matched=True)
          (out/'remote-readback.json').write_text(json.dumps({'assetCommit':os.environ['ASSET_COMMIT'],'assetPath':os.environ['ASSET_PATH'],'allMatched':True,'files':files},indent=2))
          PY
          "$BLENDER" -b output/Character01_PBR010.blend --python-exit-code 1 --python-expr "import bpy; assert bpy.data.objects['Body'].get('art010'); assert bpy.data.objects.get('Loose over-trapezius panel L'); print('ART010_REMOTE_PBR_REOPEN_PASS')" > output/reopen.log 2>&1
          grep -q ART010_REMOTE_PBR_REOPEN_PASS output/reopen.log
      - name: Render the actual remotely downloaded GLB after reimport
        run: |
          set -euo pipefail
          "$BLENDER" -b -t 4 --python-exit-code 1 --python tools/art/export010.py -- --out output --review > output/reimport.log 2>&1
          grep -q ART010_REIMPORT_PASS output/reimport.log
      - name: Preserve readback evidence and actual export render
        if: always() && steps.save.outcome == 'success'
        run: |
          set -euo pipefail
          dst="$RUNNER_TEMP/persistent-art/$ASSET_PATH"
          cp output/*.json output/*.log "$dst/"
          if test -d output/reimport; then cp -r output/reimport "$dst/"; fi
          cd "$RUNNER_TEMP/persistent-art"
          git add "$ASSET_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Verify Art010 exported files and render ${GITHUB_SHA:0:12} [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/art-checkpoints; then break; fi
              git fetch origin art-checkpoints
              git rebase FETCH_HEAD
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art010-portable-verified
          path: output/
          retention-days: 30
          if-no-files-found: error
