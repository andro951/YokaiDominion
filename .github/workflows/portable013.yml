name: Art013 verified portable files
on:
  push:
    paths: ['tools/art/export013.py', '.github/workflows/portable013.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export-save-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact reviewed master and portable material baseline
        run: |
          set -euo pipefail
          mkdir -p output
          curl -fL --retry 3 https://raw.githubusercontent.com/andro951/YokaiDominion/e94d088dbef1f919ff23bba24ad4e970cfc33453/art/checkpoints/art013/705063316f9f/Character01_Art013.blend -o "$RUNNER_TEMP/master.blend"
          echo "b3b17ad6fd91a210d231058fe7229e3308e5539d76bc1a58b7e9e4ccbab6aa66  $RUNNER_TEMP/master.blend" | sha256sum -c -
          curl -fL --retry 3 https://raw.githubusercontent.com/andro951/YokaiDominion/b211dee15cdb391ef0c2df93167b14a6795b7410/art/checkpoints/portable012/995ee19563fa/Character01_PBR012.blend -o "$RUNNER_TEMP/portable.blend"
          echo "90d993e175940aacb530241f0b60640f178e7117dc6c5087329c37ca893c8d13  $RUNNER_TEMP/portable.blend" | sha256sum -c -
          echo "ASSET_PATH=art/checkpoints/portable013/${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > output/source.ref
          cp tools/art/export013.py tools/art/finish013.py tools/art/review013.py output/
      - name: Install verified Blender
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o blender.tar.xz
          echo '975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  blender.tar.xz' | sha256sum -c -
          tar -xf blender.tar.xz
          echo "BLENDER=$RUNNER_TEMP/blender-4.5.3-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Save corrected portable Blender and GLB geometry
        env:
          OPENBLAS_NUM_THREADS: 2
        run: |
          set -euo pipefail
          "$BLENDER" -b -t 4 --python-exit-code 1 --python tools/art/export013.py -- --master "$RUNNER_TEMP/master.blend" --portable "$RUNNER_TEMP/portable.blend" --out output > output/export.log 2>&1
          grep -q ART013_PORTABLE_PASS output/export.log
      - name: Commit actual binaries before rendering
        id: save
        run: |
          set -euo pipefail
          git config user.name 'Yokai checkpoint bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 origin art-checkpoints
          git worktree add --detach "$RUNNER_TEMP/assets" FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/assets/$ASSET_PATH"
          cp output/* "$RUNNER_TEMP/assets/$ASSET_PATH/"
          cd "$RUNNER_TEMP/assets"
          git add "$ASSET_PATH"
          git commit -m "Save actual Art013 portable models ${GITHUB_SHA:0:12} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/art-checkpoints; then break; fi
            git fetch origin art-checkpoints;git rebase FETCH_HEAD
          done
          commit=$(git rev-parse HEAD)
          git fetch origin art-checkpoints;git merge-base --is-ancestor "$commit" FETCH_HEAD
          echo "ASSET_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Download committed binaries and verify exact contents
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,hashlib,pathlib,urllib.request
          out=pathlib.Path('output');m=json.loads((out/'portable-manifest.json').read_text());checks={}
          for name,expected in m['files'].items():
              url=f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/{os.environ['ASSET_COMMIT']}/{os.environ['ASSET_PATH']}/{name}"
              with urllib.request.urlopen(url,timeout=180) as r:data=r.read()
              assert len(data)==expected['bytes'] and hashlib.sha256(data).hexdigest()==expected['sha256']
              (out/name).write_bytes(data);checks[name]=dict(expected,matched=True)
          (out/'remote-readback.json').write_text(json.dumps({'assetCommit':os.environ['ASSET_COMMIT'],'assetPath':os.environ['ASSET_PATH'],'allMatched':True,'files':checks},indent=2))
          PY
          "$BLENDER" -b output/Character01_PBR013.blend --python-exit-code 1 --python-expr "import bpy; assert bpy.data.objects['Body'].get('art013'); assert bpy.data.objects['Loose over-trapezius panel L'].get('art013'); print('ART013_PBR_REMOTE_REOPEN_PASS')" > output/reopen.log 2>&1
          grep -q ART013_PBR_REMOTE_REOPEN_PASS output/reopen.log
      - name: Reimport and render the remotely downloaded GLB
        run: |
          "$BLENDER" -b -t 4 --python-exit-code 1 --python tools/art/export013.py -- --out output --review > output/reimport.log 2>&1
      - name: Persist actual export views and verification
        if: always() && steps.save.outcome == 'success'
        run: |
          set -euo pipefail
          cp output/*.json output/*.log "$RUNNER_TEMP/assets/$ASSET_PATH/"
          if test -d output/reimport; then cp -r output/reimport "$RUNNER_TEMP/assets/$ASSET_PATH/"; fi
          cd "$RUNNER_TEMP/assets"
          git add "$ASSET_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Save Art013 exported-model inspection ${GITHUB_SHA:0:12} [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/art-checkpoints; then break; fi
              git fetch origin art-checkpoints;git rebase FETCH_HEAD
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art013-portable-verified
          path: output/
          retention-days: 30
          if-no-files-found: error
